<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>決算書の勉強</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f4f2; --surface:#fcfcfb; --surface-2:#f0efec; --border:#dddcd6;
  --text:#0b0b0b; --text-2:#52514e; --muted:#85847f; --grid:#e8e7e2;
  --accent:#2a78d6;
  --c1:#2a78d6; --c2:#1baf7a; --c3:#6250d6; --c4:#eb6834; --c5:#eda100; --c6:#e87ba4; --c7:#008300; --c8:#85847f;
  --good:#0f7b3f; --good-bg:rgba(0,131,0,.10);
  --warn:#9a5c00; --warn-bg:rgba(237,161,0,.16);
  --bad:#c62f2f; --bad-bg:rgba(227,73,72,.12);
  --na:#6b6a66; --na-bg:rgba(133,132,127,.12);
  --shadow:0 10px 30px rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111110; --surface:#1a1a19; --surface-2:#242422; --border:#363531;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86; --grid:#2c2b28;
    --accent:#3987e5;
    --c1:#3987e5; --c2:#199e70; --c3:#9085e9; --c4:#d95926; --c5:#c98500; --c6:#d55181; --c7:#2f9a2f; --c8:#8f8e86;
    --good:#4cc27a; --good-bg:rgba(0,131,0,.20);
    --warn:#e0a63a; --warn-bg:rgba(201,133,0,.20);
    --bad:#ef7a7a; --bad-bg:rgba(230,103,103,.18);
    --na:#a9a89f; --na-bg:rgba(143,142,134,.16);
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111110; --surface:#1a1a19; --surface-2:#242422; --border:#363531;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86; --grid:#2c2b28;
  --accent:#3987e5;
  --c1:#3987e5; --c2:#199e70; --c3:#9085e9; --c4:#d95926; --c5:#c98500; --c6:#d55181; --c7:#2f9a2f; --c8:#8f8e86;
  --good:#4cc27a; --good-bg:rgba(0,131,0,.20);
  --warn:#e0a63a; --warn-bg:rgba(201,133,0,.20);
  --bad:#ef7a7a; --bad-bg:rgba(230,103,103,.18);
  --na:#a9a89f; --na-bg:rgba(143,142,134,.16);
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding:10px 16px 40px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 8px}
header h1{font-size:20px;margin:0}
header .sub{font-size:12px;color:var(--text-2)}
header .sp{flex:1}
button,input,select{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;min-height:36px;cursor:pointer}
button:hover{border-color:var(--text-2)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.sm{min-height:30px;padding:2px 10px;font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:10px;overflow-x:auto}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:8px 14px;white-space:nowrap;color:var(--text-2)}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--text);font-weight:700}
.maintabs{position:sticky;top:0;z-index:20;background:var(--bg)}
.maintabs button{font-size:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;min-width:0}
.card h2{font-size:16px;margin:0 0 8px}
.card h3{font-size:14px;margin:12px 0 6px;color:var(--text-2)}
details.card>summary{cursor:pointer;font-weight:700}
details.card[open]>summary{margin-bottom:8px}
.note{font-size:12px;color:var(--text-2)}
.unit{display:inline-block;font-size:12px;color:var(--text-2);background:var(--surface-2);border-radius:6px;padding:0 8px;margin-left:6px;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.term{background:none;border:0;padding:0;min-height:0;border-radius:2px;color:inherit;font:inherit;text-decoration:underline dotted;text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:help;text-align:left}
.term:hover{color:var(--accent)}
/* BS */
.tacc{display:grid;grid-template-columns:minmax(0,1fr);gap:0;border:2px solid var(--text-2);border-radius:10px;overflow:hidden}
@media (min-width:720px){.tacc{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.tacc>.side+.side{border-left:2px solid var(--text-2)}}
@media (max-width:719.98px){.tacc>.side+.side{border-top:2px solid var(--text-2)}}
.side{padding:8px 10px;min-width:0}
.side>.sidehd{font-weight:700;text-align:center;padding:4px 0 6px;border-bottom:1px solid var(--border);margin-bottom:4px}
.grp{margin:6px 0 2px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.fld{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 6px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--grid)}
.fld .lab{font-size:14px;min-width:0}
.fld .lab small{color:var(--muted)}
.fld .ctl{display:flex;align-items:center;gap:3px}
.fld .ctl input{width:96px;text-align:right;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 6px;min-height:34px;font-variant-numeric:tabular-nums}
.fld .ctl input[aria-invalid="true"]{border-color:var(--bad);background:var(--bad-bg)}
.fld .ctl button{min-width:32px;min-height:34px;padding:0 6px}
.fld .pct{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fld .msg{grid-column:1/-1;font-size:12px;color:var(--bad);font-weight:600}
.fld .msg.warn{color:var(--warn)}
.fld.indent .lab{padding-left:14px}
.fld.calc{background:var(--surface-2);border-radius:6px;padding:6px 8px;border-bottom:0;margin:4px 0}
.fld.calc .lab{font-weight:700}
.fld.calc .val{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.tot{display:flex;justify-content:space-between;font-weight:700;padding:6px 2px;border-top:2px solid var(--text-2);margin-top:6px;font-variant-numeric:tabular-nums}
.balance{margin-top:10px;padding:8px 12px;border-radius:10px;border:1px solid}
.balance.ok{border-color:var(--good);background:var(--good-bg)}
.balance.ng{border-color:var(--bad);background:var(--bad-bg)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:8px 0}
.stat>div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stat .k{font-size:12px;color:var(--text-2)}
.stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .v.neg{color:var(--bad)}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--text-2);font-size:12px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;display:none;z-index:5;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text-2);margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
.caution{border-left:4px solid var(--warn);background:var(--warn-bg);padding:8px 12px;border-radius:6px;font-size:13px;margin:8px 0}
.disc{border:1px solid var(--border);background:var(--surface-2);padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:10px}
/* 判定 */
.st{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;border-radius:999px;padding:1px 10px;white-space:nowrap}
.st.good{color:var(--good);background:var(--good-bg)}
.st.warn{color:var(--warn);background:var(--warn-bg)}
.st.danger{color:var(--bad);background:var(--bad-bg)}
.st.na,.st.info{color:var(--na);background:var(--na-bg)}
.ind{border:1px solid var(--border);border-left-width:6px;border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--surface)}
.ind.good{border-left-color:var(--good)}.ind.warn{border-left-color:var(--warn)}.ind.danger{border-left-color:var(--bad)}.ind.na,.ind.info{border-left-color:var(--na)}
.ind.changed{box-shadow:0 0 0 2px var(--accent)}
.ind .hd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.ind .nm{font-weight:700;font-size:15px}
.ind .vv{margin-left:auto;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.ind p{margin:6px 0 4px}
.ind .chg{font-size:12px;font-weight:700;color:var(--accent);background:var(--surface-2);border-radius:6px;padding:0 6px}
.ind details summary{cursor:pointer;font-size:13px;color:var(--text-2)}
.ind dl{margin:6px 0 0;font-size:13px}
.ind dt{font-weight:700;color:var(--text-2);margin-top:6px}
.ind dd{margin:2px 0 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--border);border-radius:999px;padding:2px 8px;background:var(--surface);min-height:28px}
.chip.changed{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);font-weight:700}
.chip .ic{font-weight:700}
.chip.good .ic{color:var(--good)}.chip.warn .ic{color:var(--warn)}.chip.danger .ic{color:var(--bad)}.chip.na .ic,.chip.info .ic{color:var(--na)}
.banner{border:2px solid var(--bad);background:var(--bad-bg);border-radius:10px;padding:10px 12px;margin-bottom:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 6px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{color:var(--text-2);font-weight:600}
.tbl{overflow-x:auto}
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.th-item{background:var(--surface-2);border-radius:8px;padding:8px}
.th-item .ttl{font-weight:700;font-size:13px;margin-bottom:4px}
.th-item label{font-size:12px;color:var(--text-2);display:inline-flex;align-items:center;gap:4px;margin-right:8px}
.th-item input{width:70px;text-align:right;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:2px 6px;min-height:30px}
.th-item .msg{font-size:12px;color:var(--bad);font-weight:600}
.gl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.gl-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;text-align:left;min-height:0;display:block;width:100%}
.gl-item b{display:block;font-size:15px}
.gl-item .y{font-size:11px;color:var(--muted)}
.gl-item .s{font-size:13px;color:var(--text-2);display:block;margin-top:2px}
select{max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 6px;min-height:34px}
input[type=search]{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;min-height:40px}
/* 用語シート */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50}
.sheet{position:fixed;z-index:51;background:var(--surface);color:var(--text);box-shadow:var(--shadow);display:flex;flex-direction:column;
  left:0;right:0;bottom:0;max-height:82vh;border-radius:16px 16px 0 0;border:1px solid var(--border)}
@media (min-width:720px){.sheet{left:auto;top:0;bottom:0;right:0;width:420px;max-height:none;border-radius:0}}
.sheet .sh-hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.sheet .sh-hd h2{font-size:18px;margin:0;flex:1}
.sheet .sh-bd{overflow-y:auto;padding:4px 16px 20px}
.sheet h3{font-size:13px;color:var(--text-2);margin:14px 0 4px}
.sheet p{margin:0}
.sheet .formula{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:var(--surface-2);border-radius:6px;padding:6px 8px}
.sheet .rel{display:flex;flex-wrap:wrap;gap:6px}
.sheet .rel button{min-height:32px;font-size:13px}
.chk{font-size:11px;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:0 6px;font-weight:700;margin-left:4px}
.grip{width:40px;height:4px;border-radius:2px;background:var(--border);margin:6px auto 0}
@media (min-width:720px){.grip{display:none}}
footer{margin-top:20px;font-size:12px;color:var(--text-2);border-top:1px solid var(--border);padding-top:10px}
.tests li{margin:6px 0}
.tests .d{font-size:12px;color:var(--text-2);white-space:pre-wrap}
.pass{color:var(--good);font-weight:700}.fail{color:var(--bad);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:32px;padding:2px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>決算書の勉強</h1><div class="sub">貸借対照表・損益計算書を、数字を動かして読む（学習用・数字はすべて架空）</div></div>
  <div class="sp"></div>
  <button type="button" id="themeBtn">テーマ: 自動</button>
</header>

<nav class="tabs maintabs" role="tablist" aria-label="主なタブ" id="mainTabs">
  <button role="tab" type="button" data-main="home" aria-selected="true">家庭</button>
  <button role="tab" type="button" data-main="corp" aria-selected="false">企業</button>
  <button role="tab" type="button" data-main="gloss" aria-selected="false">用語集</button>
</nav>

<div id="view-home" class="mainview" data-view="home"></div>
<div id="view-corp" class="mainview" data-view="corp" hidden></div>
<div id="view-gloss" class="mainview" data-view="gloss" hidden></div>

<section class="card" id="testCard">
  <h2>確認用テスト</h2>
  <div class="note">計算関数（KessanCalc）と用語辞書を確かめます。入力した数字には影響しません。</div>
  <button type="button" class="primary" id="runTests" style="margin-top:8px">テストを実行</button>
  <div id="testOut"></div>
</section>

<footer>
  <p><b>保存について：</b>入力した数字はこのブラウザ内（localStorage）だけに保存され、外部には送られません。公開ページに、実際の家計や会社の数字を載せないでください。</p>
  <p><b>学習用です。</b>このアプリは決算書の読み方を学ぶためのもので、投資・融資・会計・税務の助言ではありません。目安は一般的なもので、業種・規模・時期・家庭の状況によって異なります。判断が必要なときは専門家にご相談ください。</p>
</footer>
<pre id="testJson" hidden></pre>
</div>

<div class="overlay" id="overlay" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden tabindex="-1">
  <div class="grip" aria-hidden="true"></div>
  <div class="sh-hd">
    <button type="button" class="sm" id="shBack" hidden aria-label="前の用語に戻る">← 戻る</button>
    <h2 id="shTitle"></h2>
    <button type="button" class="sm" id="shClose" aria-label="閉じる">閉じる ✕</button>
  </div>
  <div class="sh-bd" id="shBody"></div>
</div>

<script>
/* =====================================================================
   用語データ（すべての用語の説明はここ1か所）
   short: ひとことで言うと / home: 家庭でいうと / corp: 企業でいうと / look: どこを見るとよいか
   formula: 計算式（指標のみ） / related: 関連用語 / check: true なら「要確認」の印
   ===================================================================== */
const GLOSSARY = {
  '貸借対照表': { yomi: 'たいしゃくたいしょうひょう', short: 'ある時点で、何をどれだけ持っていて（資産）、その元手をどこから調達したか（負債・純資産）を示す表。バランスシート（BS）とも呼ばれる。', home: '「今、家計にどんな財産と借金があるか」の一覧表。', corp: '決算日時点の、会社の財産と借入などの一覧。', look: '左（資産）の合計と、右（負債＋純資産）の合計は必ず一致する。どちら側の何が大きいかを見る。', related: ['資産', '負債', '純資産', '損益計算書'] },
  '損益計算書': { yomi: 'そんえきけいさんしょ', short: '一定の期間（ふつう1年）に、どれだけ稼ぎ（収益）、どれだけ使い（費用）、いくら利益が残ったかを示す表。PLとも呼ばれる。', home: '1年間の家計簿のまとめ（収入・支出・年間収支）。', corp: '売上高から始まり、段階ごとに費用を引いて、最後に当期純利益を出す。', look: 'どの段階の利益が大きく減っているか（原価か、販管費か、利息か）。', related: ['売上高', '営業利益', '経常利益', '当期純利益', '貸借対照表'] },
  '資産': { yomi: 'しさん', short: '持っている、お金やお金に換えられる財産。', home: '現金・預貯金、株式・投資信託、自宅、自動車など。', corp: '現金預金、売掛金、在庫、建物・機械など。', look: '合計額だけでなく、すぐ現金になるもの（流動資産）と、長く使うもの（固定資産）の割合を見る。', related: ['負債', '純資産', '流動資産', '固定資産', '総資産'] },
  '総資産': { yomi: 'そうしさん', short: '資産の合計。貸借対照表の左側の合計。', home: '家計の財産をすべて足した額。', corp: '会社の資産をすべて足した額。', look: '自己資本比率やROAの分母になる。', related: ['資産', '自己資本比率', 'ROA'] },
  '負債': { yomi: 'ふさい', short: '将来、返したり支払ったりしなければならない義務。', home: '住宅ローン、自動車ローン、カードローンなど。', corp: '買掛金、借入金、未払金など。', look: '金額と、いつまでに返すか（1年以内か）、金利の高さ。', related: ['資産', '純資産', '流動負債', '固定負債', '負債比率'] },

  function setMain(m) {
    S.ui.main = m;
    $$('#mainTabs [data-main]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.main === m)));
    $$('.mainview').forEach(v => v.hidden = v.dataset.view !== m);
    if (m !== 'gloss' && started) renderDerived(m);   // 非表示のあいだに描いたグラフを、表示された幅で描き直す
    persist();
  }
  function setSub(mode, s) {
    S.ui.sub[mode] = s;
    $$(`[data-sub^="${mode}."]`).forEach(b => b.setAttribute('aria-selected', String(b.dataset.sub === `${mode}.${s}`)));
    $$(`[data-panel^="${mode}."]`).forEach(p => p.hidden = p.dataset.panel !== `${mode}.${s}`);
    $('#chips-' + mode).hidden = s === 'dx';
    if (started) renderDerived(mode);
    persist();
  }
  $$('#mainTabs [data-main]').forEach(b => b.onclick = () => setMain(b.dataset.main));

  function refreshInputs(mode) { $$(`input[data-in^="${mode}."]`).forEach(i => { i.removeAttribute('aria-invalid'); document.getElementById(i.id + '-msg').textContent = ''; showValue(i); }); }
  function afterChange(mode) { renderDerived(mode); persist(); }
  const out = (key, html) => $$(`[data-o="${key}"]`).forEach(e => e.innerHTML = html);

  /* ---------- 積み上げ棒（BS） ---------- */
  function stackBars(host, cols, unit) {
    const W = Math.max(280, Math.round(host.clientWidth || 600)), H = 280, mt = 26, mb = 10, ph = H - mt - mb;
    const total = Math.max(...cols.map(c => c.segs.reduce((a, s) => a + Math.max(0, s.v), 0)), 1e-9);
    const colW = Math.min(170, (W - 40) / cols.length - 30), gap = (W - colW * cols.length) / (cols.length + 1);
    const g = [];
    cols.forEach((c, ci) => {
      const x = gap + ci * (colW + gap); let y = mt + ph;
      const ctot = c.segs.reduce((a, s) => a + Math.max(0, s.v), 0);
      g.push(`<text x="${x + colW / 2}" y="14" text-anchor="middle" style="font-weight:700;fill:var(--text)">${esc(c.title)}</text>`);
      c.segs.forEach(s => {
        if (s.v <= 0) return;
        const h = s.v / total * ph; y -= h;
        g.push(`<rect x="${x}" y="${y + 1}" width="${colW}" height="${Math.max(0, h - 2)}" rx="3" fill="${s.color}" ${s.dash ? 'fill-opacity=".25" stroke="' + s.color + '" stroke-dasharray="5 3"' : ''}><title>${esc(s.name)} ${fmt(s.v)}${unit}（${fmt(s.v / ctot * 100)}%）</title></rect>`);
        if (h > 26) g.push(`<text x="${x + colW / 2}" y="${y + h / 2 - 2}" text-anchor="middle" style="fill:${s.dash ? 'var(--text)' : '#fff'};font-weight:700">${esc(s.name)}</text><text x="${x + colW / 2}" y="${y + h / 2 + 13}" text-anchor="middle" style="fill:${s.dash ? 'var(--text)' : '#fff'}">${fmt(s.v / ctot * 100)}%</text>`);
        else if (h > 12) g.push(`<text x="${x + colW / 2}" y="${y + h / 2 + 4}" text-anchor="middle" style="fill:${s.dash ? 'var(--text)' : '#fff'};font-size:11px">${esc(s.name)} ${fmt(s.v / ctot * 100, 0)}%</text>`);
      });
    });
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(cols.map(c => c.title + '：' + c.segs.filter(s => s.v > 0).map(s => `${s.name} ${fmt(s.v)}${unit}`).join('、')).join('／'))}">${g.join('')}</svg>
      <div class="legend">${cols.flatMap(c => c.segs).filter((s, i, a) => s.v > 0 && a.findIndex(x => x.name === s.name) === i).map(s => `<span><i style="background:${s.color}${s.dash ? ';opacity:.4' : ''}"></i>${esc(s.name)} ${fmt(s.v)}${unit}</span>`).join('')}</div>`;
  }

  /* ---------- 横棒（収入の使い道） ---------- */
  function useBar(host, legendHost, income, segs) {
    const W = Math.max(280, Math.round(host.clientWidth || 600)), H = 64, ml = 4, mr = 4, pw = W - ml - mr;
    const tot = Math.max(income, segs.reduce((a, s) => a + s.v, 0), 1e-9);
    let x = ml; const g = [];
    segs.forEach(s => { if (s.v <= 0) return; const w = s.v / tot * pw; g.push(`<rect x="${x + 1}" y="10" width="${Math.max(0, w - 2)}" height="34" rx="3" fill="${s.color}" ${s.dash ? 'fill-opacity=".25" stroke="' + s.color + '" stroke-dasharray="4 3"' : ''}><title>${esc(s.name)} ${fmt(s.v)}万円</title></rect>`); if (w > 46) g.push(`<text x="${x + w / 2}" y="32" text-anchor="middle" style="fill:${s.dash ? 'var(--text)' : '#fff'};font-weight:700;font-size:11px">${fmt(income > 0 ? s.v / income * 100 : 0, 0)}%</text>`); x += w; });
    if (income > 0 && income < tot) { const xi = ml + income / tot * pw; g.push(`<line x1="${xi}" x2="${xi}" y1="4" y2="52" stroke="var(--text)" stroke-width="2"/><text x="${xi}" y="62" text-anchor="${xi > W - 60 ? 'end' : 'middle'}" style="fill:var(--text);font-size:11px">収入合計</text>`); }
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="収入の使い道">${g.join('')}</svg>`;
    legendHost.innerHTML = segs.filter(s => s.v > 0).map(s => `<span><i style="background:${s.color}${s.dash ? ';opacity:.4' : ''}"></i>${esc(s.name)} ${fmt(s.v)}万円${income > 0 ? `（${fmt(s.v / income * 100)}%）` : ''}</span>`).join('');
  }

  /* ---------- ウォーターフォール（横向き） ---------- */
  function waterfall(host, p, t) {
    const rows = [
      ['売上高', p.sales, 'total'], ['売上原価', -p.cogs, 'step'], ['売上総利益', t.gross, 'total'], ['販管費', -p.sga, 'step'], ['営業利益', t.op, 'total'],
      ['営業外収益', p.noi, 'step'], ['営業外費用', -p.noe, 'step'], ['経常利益', t.ord, 'total'], ['特別利益', p.xg, 'step'], ['特別損失', -p.xl, 'step'],
      ['税引前当期純利益', t.pre, 'total'], ['法人税等', -p.tax, 'step'], ['当期純利益', t.net, 'total']];
    let run = 0; const bars = rows.map(([n, v, k]) => { if (k === 'total') { run = v; return { n, a: 0, b: v, v, k }; } const a = run; run += v; return { n, a, b: run, v, k }; });
    const lo = Math.min(0, ...bars.map(b => Math.min(b.a, b.b))), hi = Math.max(0, ...bars.map(b => Math.max(b.a, b.b)), 1e-9);
    const W = Math.max(300, Math.round(host.clientWidth || 600)), rowH = 24, ml = W < 480 ? 104 : 130, mr = 70, H = bars.length * rowH + 20, pw = W - ml - mr;
    const X = v => ml + (v - lo) / (hi - lo) * pw;
    const g = [`<line x1="${X(0)}" x2="${X(0)}" y1="4" y2="${H - 10}" stroke="var(--muted)"/>`];
    bars.forEach((b, i) => {
      const y = 8 + i * rowH, x0 = X(Math.min(b.a, b.b)), w = Math.max(1, Math.abs(X(b.b) - X(b.a)));
      const col = b.k === 'total' ? (b.v < 0 ? 'var(--bad)' : 'var(--c1)') : b.v < 0 ? 'var(--c4)' : 'var(--c2)';
      g.push(`<text x="${ml - 6}" y="${y + 15}" text-anchor="end" style="${b.k === 'total' ? 'fill:var(--text);font-weight:700' : ''}">${esc(b.n)}</text>`);
      g.push(`<rect x="${x0}" y="${y + 3}" width="${w}" height="${rowH - 8}" rx="3" fill="${col}"><title>${esc(b.n)} ${fmt(b.v)}百万円</title></rect>`);
      if (i < bars.length - 1) g.push(`<line x1="${X(b.b)}" x2="${X(b.b)}" y1="${y + rowH - 5}" y2="${y + rowH + 3}" stroke="var(--muted)" stroke-dasharray="2 2"/>`);
      g.push(`<text x="${Math.max(X(b.a), X(b.b)) + 4}" y="${y + 15}" style="font-variant-numeric:tabular-nums${b.k === 'total' ? ';fill:var(--text);font-weight:700' : ''}">${b.k === 'step' && b.v > 0 ? '+' : ''}${fmt(b.v)}</text>`);
    });
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="ウォーターフォール図：${esc(bars.map(b => b.n + ' ' + fmt(b.v)).join('、'))}">${g.join('')}</svg>`;
  }

  /* ---------- 診断の表示 ---------- */
  function chipsHTML(mode, r) {
    const b = base[mode];
    return r.list.map(x => { const ch = b && b[x.id] && b[x.id] !== x.status; return `<button type="button" class="chip ${x.status}${ch ? ' changed' : ''}" data-goto="${mode}.dx" title="${esc(x.term)}：${esc(K.LABEL[x.status])}"><span class="ic" aria-hidden="true">${K.ICON[x.status]}</span>${esc(x.term)} ${esc(K.LABEL[x.status])}${ch ? `（前：${esc(K.LABEL[b[x.id]])}）` : ''}</button>`; }).join('');
  }
  function dxHTML(mode, r) {
    const b = base[mode], sorted = K.sortList(r.list);
    const changed = sorted.filter(x => b && b[x.id] && b[x.id] !== x.status);
    const rank = { danger: 0, warn: 1, na: 2, info: 2, good: 3 };
    let h = '';
    if (r.flags.kuroji) h += `<div class="banner" role="alert"><b>✕ ${term('黒字倒産')}の危険：</b>${term('当期純利益')}は黒字（${fmt(r.totals.net)}百万円）ですが、${term('手元流動性')}が「危険」です。利益が出ていても、${term('売掛金')}の入金が遅れたり、${term('棚卸資産')}（在庫）に現金が寝ていたりすると、支払いに使う現金が足りなくなることがあります。利益と現金の動きは同じではありません。</div>`;
    if (r.flags.insolvent) h += `<div class="banner" role="alert"><b>✕ ${term('債務超過')}：</b>純資産がマイナス（${fmt(r.totals.eq)}百万円）です。</div>`;
    h += `<p class="note">${b ? (changed.length ? `比較の基準から判定が変わった指標：<b>${changed.length}件</b>（青い枠）` : '比較の基準から、判定が変わった指標はありません。') : ''}　悪い指標から順に並べています。</p>`;
    h += sorted.map(x => {
      const prev = b && b[x.id], ch = prev && prev !== x.status;
      const dirTxt = ch ? (rank[x.status] > rank[prev] ? '改善' : rank[x.status] < rank[prev] ? '悪化' : '変化') : '';
      return `<article class="ind ${x.status}${ch ? ' changed' : ''}">
        <div class="hd"><span class="st ${x.status}"><span aria-hidden="true">${K.ICON[x.status]}</span>${esc(K.LABEL[x.status])}</span><span class="nm">${term(x.term)}</span>${ch ? `<span class="chg">${esc(K.LABEL[prev])} → ${esc(K.LABEL[x.status])}（${dirTxt}）</span>` : ''}<span class="vv">${esc(x.valueText)}</span></div>
        <p>${esc(x.comment)}</p>
        <details><summary>目安・なぜ・例外・改善のヒント</summary><dl>
          <dt>目安</dt><dd>${esc(x.criteria)}</dd>
          ${G[x.term] && G[x.term].formula ? `<dt>計算式</dt><dd>${esc(G[x.term].formula)}</dd>` : ''}
          <dt>なぜその目安か</dt><dd>${esc(x.why)}</dd><dt>例外（当てはまらない場合）</dt><dd>${esc(x.except)}</dd><dt>改善のヒント</dt><dd>${esc(x.hint)}</dd></dl></details>
      </article>`;
    }).join('');
    const o = K.overall(r.list);
    const li = arr => arr.map(x => `<li>${term(x.term)}（${esc(x.valueText)}）：${esc(x.comment)}</li>`).join('');
    h += `<div class="card"><h2>総合コメント</h2>
      <h3>良い点</h3>${o.goods.length ? `<ul>${li(o.goods)}</ul>` : '<p class="note">今のところ、目安を満たしている指標はありません。</p>'}
      <h3>気をつけたい点</h3>${o.bads.length ? `<ul>${li(o.bads)}</ul>` : '<p class="note">目安から外れている指標はありません。</p>'}
      <p class="note">指標は互いに関係しています。1つの数字だけでなく、いくつかを組み合わせて見てください。</p></div>`;
    return h;
  }

  /* ---------- 計算結果の表示（入力欄は作り直さない） ---------- */
  function renderDerived(mode) {
    const r = diag(mode), t = r.totals;
    if (mode === 'home') {
      const d = S.data.home;
      out('home.assets', fmt(t.assets)); out('home.liab', fmt(t.liab)); out('home.right', fmt(t.liab + t.nw)); out('home.fin', fmt(t.fin));
      out('home.nw', `<span style="${t.nw < 0 ? 'color:var(--bad)' : ''}">${fmt(t.nw)}${t.nw < 0 ? '（債務超過）' : ''}</span>`);
      out('home.nwpct', `<span>構成比</span><span>${t.assets > 0 ? fmt(t.nw / t.assets * 100) + '%' : '—'}</span>`);
      $$('[data-pct^="home.bs."]').forEach(e => { const k = e.dataset.pct.split('.')[2]; e.innerHTML = `<span>構成比</span><span>${t.assets > 0 ? fmt(d.bs[k] / t.assets * 100) + '%' : '—'}</span>`; });
      $$('[data-pct^="home.pl."]').forEach(e => { const k = e.dataset.pct.split('.')[2]; e.innerHTML = `<span>収入合計に対して${S.monthly ? `（年額 ${fmt(d.pl[k])}万円）` : ''}</span><span>${t.income > 0 ? fmt(d.pl[k] / t.income * 100) + '%' : '—'}</span>`; });
      const ym = S.monthly ? 12 : 1;
      out('home.income', fmt(t.income / ym, 2) + (S.monthly ? '／月' : '')); out('home.expense', fmt(t.expense / ym, 2) + (S.monthly ? '／月' : ''));
      out('home.plunit', S.monthly ? '万円／月（年額に換算して計算）' : '万円／年');
      out('home.mnote', S.monthly ? '月額で入力しています。入力した値を12倍して年額として計算します（賞与は年額のまま）。' : '年額で入力しています。');
      $$('[data-monthly]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.monthly === '1') === S.monthly)));
      out('home.stats', [['収入合計（年）', t.income, ''], ['支出合計（年）', t.expense, ''], [term('年間収支'), t.balance, t.balance < 0 ? 'neg' : ''], [term('手取り') + '（年）', t.takeHome, ''], ['月間支出（税・社保を除く）', t.monthly, '']]
        .map(([k, v, c]) => `<div><div class="k">${k}</div><div class="v ${c}">${fmt(v)} 万円</div></div>`).join(''));
      stackBars($('#bsChart-home'), [
        { title: '資産', segs: [{ name: '金融資産', v: t.fin, color: 'var(--c1)' }, { name: '自宅', v: d.bs.house, color: 'var(--c2)' }, { name: '自動車・その他', v: d.bs.car + d.bs.oa, color: 'var(--c3)' }, { name: '債務超過分', v: t.nw < 0 ? -t.nw : 0, color: 'var(--bad)', dash: true }] },
        { title: '負債＋純資産', segs: [{ name: '住宅ローン', v: d.bs.mort, color: 'var(--c4)' }, { name: 'その他のローン', v: d.bs.carLoan + d.bs.ol, color: 'var(--c5)' }, { name: '高金利負債', v: d.bs.high, color: 'var(--c6)' }, { name: '純資産', v: Math.max(0, t.nw), color: 'var(--c7)' }] }], '万円');
      const p = d.pl;
      useBar($('#useChart'), $('#useLegend'), t.income, [
        { name: '税金・社会保険料', v: p.tax, color: 'var(--c8)' }, { name: '住居費・住宅ローン', v: p.rent + p.mortPay, color: 'var(--c4)' }, { name: 'その他のローン', v: p.loanPay, color: 'var(--c6)' },
        { name: '食費', v: p.food, color: 'var(--c5)' }, { name: '光熱・通信・保険・交通', v: p.util + p.insPrem + p.trans, color: 'var(--c3)' }, { name: '教育・娯楽ほか', v: p.edu + p.fun, color: 'var(--c2)' },
        { name: t.balance >= 0 ? '残る貯蓄' : '不足（赤字）', v: Math.abs(t.balance), color: t.balance >= 0 ? 'var(--c7)' : 'var(--bad)', dash: t.balance < 0 }]);
    } else {
      const d = S.data.corp, p = d.pl;
      out('corp.assets', fmt(t.assets)); out('corp.liab', fmt(t.liab)); out('corp.right', fmt(t.liab + t.eq));
      ['ca', 'fa', 'cl', 'ncl', 'eq'].forEach(k => out('corp.g.' + k, `<span style="${t[k] < 0 ? 'color:var(--bad)' : ''}">${fmt(t[k])}</span>`));
      const L = new Set(['cash', 'ar', 'inv', 'oca', 'tang', 'intang', 'invest']), right = t.liab + t.eq;
      $$('[data-pct^="corp.bs."]').forEach(e => { const k = e.dataset.pct.split('.')[2], den = L.has(k) ? t.assets : right; e.innerHTML = `<span>構成比</span><span>${den !== 0 ? fmt(d.bs[k] / den * 100) + '%' : '—'}</span>`; });
      $$('[data-pct^="corp.pl."]').forEach(e => { const k = e.dataset.pct.split('.')[2]; e.innerHTML = `<span>売上高に対して</span><span>${p.sales > 0 ? fmt(p[k] / p.sales * 100) + '%' : '—'}</span>`; });
      $('#balance').innerHTML = Math.abs(t.diff) < 1e-9
        ? `<div class="balance ok"><b>✓ 貸借が一致しています。</b> 資産合計 ${fmt(t.assets)} ＝ 負債合計 ${fmt(t.liab)} ＋ 純資産合計 ${fmt(t.eq)}</div>`
        : `<div class="balance ng" role="alert"><b>✕ 貸借が一致していません。</b> 資産合計 ${fmt(t.assets)} − （負債合計 ${fmt(t.liab)} ＋ 純資産合計 ${fmt(t.eq)}）＝ 差額 <b>${t.diff > 0 ? '+' : ''}${fmt(t.diff)}</b> 百万円。学習のため、自動では直しません。<div style="margin-top:6px"><button type="button" class="sm" id="fixRe">利益剰余金で差額を調整</button></div></div>`;
      const fx = $('#fixRe'); if (fx) fx.onclick = () => { d.bs.re = Math.round((d.bs.re + t.diff) * 1000) / 1000; refreshInputs('corp'); afterChange('corp'); };
      // 内訳の整合（受取利息 ≤ 営業外収益 など）
      [['intInc', 'noi', '営業外収益'], ['intExp', 'noe', '営業外費用']].forEach(([a, b, n]) => {

      });
      ['gross', 'op', 'ord', 'pre', 'net'].forEach(k => { out('corp.' + k, `<span style="${t[k] < 0 ? 'color:var(--bad)' : ''}">${fmt(t[k])}</span>`); out('corp.m.' + k, t.margin[k] === null ? '計算できません' : fmt(t.margin[k]) + '%'); });
      stackBars($('#bsChart-corp'), [
        { title: '資産', segs: [{ name: '流動資産', v: t.ca, color: 'var(--c1)' }, { name: '固定資産', v: t.fa, color: 'var(--c2)' }, { name: '債務超過分', v: t.eq < 0 ? -t.eq : 0, color: 'var(--bad)', dash: true }] },
        { title: '負債＋純資産', segs: [{ name: '流動負債', v: t.cl, color: 'var(--c4)' }, { name: '固定負債', v: t.ncl, color: 'var(--c5)' }, { name: '純資産', v: Math.max(0, t.eq), color: 'var(--c7)' }] }], '百万円');
      waterfall($('#wfChart'), p, t);
    }
    $('#chips-' + mode).innerHTML = chipsHTML(mode, r);
    $('#dx-' + mode).innerHTML = dxHTML(mode, r);
  }

  /* ---------- 用語集 ---------- */
  function buildGloss() {
    const v = $('#view-gloss');
    v.innerHTML = `<div class="card"><h2>用語集</h2><label class="vh" for="glq">用語を検索</label><input type="search" id="glq" placeholder="用語・読み・説明で検索（例：りゅうどう、利益、ローン）"><p class="note" id="glCount"></p><div class="gl-list" id="glList"></div></div>
      <details class="card"><summary>家庭と企業の対応表</summary>${mapTable()}</details>`;
    const draw = () => {
      const q = $('#glq').value.trim().toLowerCase();
      const keys = Object.keys(G).sort((a, b) => G[a].yomi.localeCompare(G[b].yomi, 'ja')).filter(k => !q || [k, G[k].yomi, G[k].short, G[k].home, G[k].corp].join(' ').toLowerCase().includes(q));
      $('#glCount').textContent = `${keys.length} 語${q ? '（検索結果）' : ''}`;
      $('#glList').innerHTML = keys.map(k => `<button type="button" class="gl-item term" data-term="${esc(k)}" style="text-decoration:none"><b>${esc(k)}${G[k].check ? '<span class="chk">要確認</span>' : ''}</b><span class="y">${esc(G[k].yomi)}</span><span class="s">${esc(G[k].short)}</span></button>`).join('') || '<p class="note">見つかりませんでした。</p>';
    };
    $('#glq').addEventListener('input', draw); draw();
  }

  /* ---------- 用語の説明パネル ---------- */
  let lastFocus = null; const hist = [];
  function openTerm(key, from) {
    const e = G[key]; if (!e) return;
    if ($('#sheet').hidden) { lastFocus = from || document.activeElement; hist.length = 0; } else hist.push($('#shTitle').dataset.key);
    $('#shTitle').textContent = key; $('#shTitle').dataset.key = key;
    $('#shBack').hidden = !hist.length;
    $('#shBody').innerHTML = `<p class="note">${esc(e.yomi)}${e.check ? '<span class="chk">要確認</span>' : ''}</p>
      <h3>① ひとことで言うと</h3><p>${esc(e.short)}</p>
      <h3>② 家庭でいうと／企業でいうと</h3><p><b>家庭：</b>${esc(e.home)}</p><p style="margin-top:4px"><b>企業：</b>${esc(e.corp)}</p>
      <h3>③ どこを見るとよいか</h3><p>${esc(e.look)}</p>
      ${e.formula ? `<h3>④ 計算式</h3><p class="formula">${esc(e.formula)}</p>` : ''}
      <h3>${e.formula ? '⑤' : '④'} 関連用語</h3><div class="rel">${(e.related || []).map(r => `<button type="button" data-rel="${esc(r)}">${esc(r)}</button>`).join('')}</div>
      <p class="note" style="margin-top:14px">一般的な説明です。業種や制度によって扱いが異なることがあります。</p>`;
    $('#overlay').hidden = false; $('#sheet').hidden = false;
    $('#sheet').focus();
  }
  function closeTerm() { $('#overlay').hidden = true; $('#sheet').hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  $('#shClose').onclick = closeTerm; $('#overlay').onclick = closeTerm;
  $('#shBack').onclick = () => { const k = hist.pop(); if (k) { openTerm(k); hist.pop(); $('#shBack').hidden = !hist.length; } };
  $('#shBody').addEventListener('click', e => { const b = e.target.closest('[data-rel]'); if (b) openTerm(b.dataset.rel); });
  document.addEventListener('keydown', e => {
    if ($('#sheet').hidden) return;
    if (e.key === 'Escape') { e.preventDefault(); closeTerm(); return; }
    if (e.key === 'Tab') {
      const f = $$('button:not([hidden]), [tabindex="0"]', $('#sheet')).filter(x => x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === $('#sheet'))) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  /* ---------- テスト（UI が必要なものを追加） ---------- */
  function uiTests() {
    const res = K.runTests();
    const used = new Set($$('[data-term]').map(e => e.dataset.term));
    // 描画の外で使う用語（指標名・しきい値の名前）も対象
    for (const m of ['home', 'corp']) diag(m).list.forEach(x => used.add(x.term));
    const missing = [...used].filter(k => !G[k]);
    res.push({ name: '画面に出るすべての用語に、辞書の説明がある', pass: missing.length === 0, detail: `画面の用語 ${used.size} 語を確認。辞書にない用語：${missing.length ? missing.join('、') : 'なし'}` });
    const badRel = Object.entries(G).flatMap(([k, e]) => (e.related || []).filter(r => !G[r]).map(r => `${k}→${r}`));
    const incomplete = Object.entries(G).filter(([, e]) => !e.short || !e.home || !e.corp || !e.look || !e.yomi).map(([k]) => k);
    res.push({ name: '辞書の関連用語がすべて辞書にあり、各用語に①〜③がそろっている', pass: !badRel.length && !incomplete.length, detail: `辞書 ${Object.keys(G).length} 語。辞書にない関連用語：${badRel.join('、') || 'なし'}／説明が欠けている用語：${incomplete.join('、') || 'なし'}` });
    // 本物の localStorage でも往復
    let lsOk = false, lsMsg = '';
    try { const key = K.STORE_KEY; const prev = localStorage.getItem(key); K.save(localStorage, S); const back = K.load(localStorage); lsOk = !!back && JSON.stringify(back.data) === JSON.stringify(S.data); if (prev === null) localStorage.removeItem(key); else localStorage.setItem(key, prev); lsMsg = lsOk ? 'このブラウザの localStorage で保存→読み込みが一致' : '一致しない'; }
    catch (e) { lsMsg = 'localStorage が使えない環境のため省略（' + e.message + '）'; lsOk = true; }
    res.push({ name: 'このブラウザの localStorage での保存と読み込み', pass: lsOk, detail: lsMsg });
    res.push({ name: '計算関数が UI から分かれている（KessanCalc は DOM に触らない）', pass: !/document\.|window\./.test(KessanCalc.runTests.toString() + KessanCalc.homeIndicators.toString() + KessanCalc.corpIndicators.toString()), detail: 'KessanCalc の計算・判定・テスト関数のソースに document / window の参照がないことを確認' });
    return res;
  }
  function showTests() {
    const res = uiTests(), np = res.filter(r => r.pass).length;
    $('#testOut').innerHTML = `<p><b>${np} / ${res.length} 件 合格</b></p><ul class="tests">${res.map(r => `<li><span class="${r.pass ? 'pass' : 'fail'}">${r.pass ? '✔ 合格' : '✘ 不合格'}</span> ${esc(r.name)}<div class="d">${esc(r.detail)}</div></li>`).join('')}</ul>`;
    return res;
  }
  $('#runTests').onclick = showTests;

  /* ---------- 起動 ---------- */
  buildMode('home'); buildMode('corp'); buildGloss();
  refreshInputs('home'); refreshInputs('corp'); fillTh('home'); fillTh('corp');
  setBase('home'); setBase('corp');
  renderDerived('home'); renderDerived('corp');
  setMain(S.ui.main); setSub('home', S.ui.sub.home); setSub('corp', S.ui.sub.corp);
  started = true;
  if (S.ui.main !== 'gloss') renderDerived(S.ui.main);
  let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { renderDerived('home'); renderDerived('corp'); }, 150); });
  const q = new URLSearchParams(location.search);
  if (q.get('view')) { const [m, s] = q.get('view').split('.'); setMain(m); if (s) setSub(m, s); }
  if (q.get('sample')) { const id = q.get('sample'), m = id.startsWith('h-') ? 'home' : 'corp'; S.data[m] = K.sampleData(m, id); refreshInputs(m); renderDerived(m); }
  if (q.get('term')) openTerm(q.get('term'));
  if (q.get('test') === '1') { const res = showTests(); $('#testJson').textContent = JSON.stringify(res.map(r => (r.pass ? 'PASS ' : 'FAIL ') + r.name + '\n' + r.detail), null, 1); }
})();
</script>
</body>
</html>
